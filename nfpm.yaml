name: nook
arch: ${NOOK_GOARCH}
platform: linux
version: ${NOOK_VERSION}
release: ${NOOK_RELEASE}
version_schema: semver
maintainer: Nook Maintainers
license: MIT
description: Nook LAN collaboration service for OpenWrt and ImmortalWrt
scripts:
  postinstall: ./packaging/openwrt/scripts/postinstall.sh
contents:
  - src: ./dist/openwrt-${NOOK_ARCH}/nook
    dst: /usr/bin/nook
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./packaging/openwrt/files/nook.init
    dst: /etc/init.d/nook
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./packaging/openwrt/files/nook.config
    dst: /etc/config/nook
    type: config
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: ./packaging/openwrt/files/nook.config
    dst: /usr/share/nook/nook.config
    file_info:
      mode: 0644
      owner: root
      group: root

ipk:
  arch: ${NOOK_ARCH}

apk:
  arch: ${NOOK_ARCH}
