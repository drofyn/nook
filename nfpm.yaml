name: nook
arch: arm64
platform: linux
version: ${NOOK_VERSION}
release: ${NOOK_RELEASE}
version_schema: semver
maintainer: Nook Maintainers
license: MIT
description: Nook LAN collaboration service for OpenWrt and ImmortalWrt
contents:
  - src: ./dist/openwrt-aarch64_cortex-a53/nook
    dst: /usr/bin/nook
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./packaging/openwrt/files/nook.init
    dst: /etc/init.d/nook
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ./packaging/openwrt/files/nook.config
    dst: /etc/config/nook
    type: config
    file_info:
      mode: 0644
      owner: root
      group: root

ipk:
  arch: aarch64_cortex-a53

apk:
  arch: aarch64_cortex-a53
